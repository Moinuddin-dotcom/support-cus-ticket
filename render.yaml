# Render Blueprint for the backend: NestJS API (Docker) + Postgres + Key Value (Redis).
# Deploy: Render dashboard → New → Blueprint → select this repo.
# The frontend is deployed separately on Vercel (see README).
services:
  - type: web
    name: support-ticket-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: support-ticket-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: support-ticket-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: SLA_CHECK_INTERVAL_MS
        value: 300000
      # Set to your Vercel URL, e.g. https://support-desk.vercel.app (comma-separate several).
      - key: FRONTEND_URL
        sync: false
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-5-5
      - key: AI_TIMEOUT_MS
        value: 15000
      # "true" seeds demo users/tickets on each start (idempotent). Turn off for real data.
      - key: RUN_SEED
        value: "true"

  - type: keyvalue
    name: support-ticket-redis
    plan: free
    # BullMQ needs keys to persist until processed.
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: support-ticket-db
    plan: free
    databaseName: support_tickets
    user: support
