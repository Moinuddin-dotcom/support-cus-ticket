# Local development stack: PostgreSQL, Redis, NestJS API and Next.js frontend.
#   docker compose up --build
# Frontend: http://localhost:3000   API: http://localhost:4000/api   Docs: http://localhost:4000/api/docs
#
# Host ports can be overridden if they clash with local services, e.g.
#   POSTGRES_PORT=5433 docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_tickets
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_tickets"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/support_tickets?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-change-me}
      JWT_EXPIRES_IN: 1d
      SLA_CHECK_INTERVAL_MS: 60000
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: 15000
      # Seed demo users/tickets on start (idempotent). Set to "false" to skip.
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Server-side only: the Next.js BFF calls the API over the compose network.
      API_URL: http://backend:4000/api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres-data:
